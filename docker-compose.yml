services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lab0
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_net

  backend-1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=5000
      - DB_HOST=db
      - INSTANCE_NAME=backend-1
    depends_on:
      - db
    networks:
      - frontend_net
      - backend_net

  backend-2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=5000
      - DB_HOST=db
      - INSTANCE_NAME=backend-2
    depends_on:
      - db
    networks:
      - frontend_net
      - backend_net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      - ./static:/usr/share/nginx/html:ro
      - ./docs:/var/www/docs:ro
      - ./site-b:/var/www/site-b:ro
    depends_on:
      - backend-1
      - backend-2
    networks:
      - frontend_net

volumes:
  db_data:

networks:
  frontend_net:
  backend_net:
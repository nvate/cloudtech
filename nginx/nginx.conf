events {}

http {
    # Include standard MIME types so the browser knows how to handle files
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Rate limiting zone: 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Upstream pool for load balancing between two backend instances
    upstream backend {
        server backend-1:5000 max_fails=1 fail_timeout=10s;
        server backend-2:5000 max_fails=1 fail_timeout=10s;
    }

    # ------------------------------------------------------------------
    # HTTP to HTTPS redirect for all domains
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name site-a.local site-b.local;
        return 301 https://$host$request_uri;
    }

    # ------------------------------------------------------------------
    # Virtual Host 1: site-a.local (Main service)
    # ------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name site-a.local;
        charset utf-8;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        root /usr/share/nginx/html;
        index index.html;

        # Custom 404 error page
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        # Serve static frontend files
        location / {
            try_files $uri $uri/ =404;
        }

        # Serve docs from a separate directory via alias
        location /docs/ {
            alias /var/www/docs/;
            index index.html;
        }

        # Proxy API requests to the backend pool with rate limiting
        location /api/ {
            limit_req zone=api burst=5 nodelay;
            proxy_pass http://backend;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_set_header Host $host;
        }

        # Protected admin area (exact match path)
        location = /admin {
            auth_basic "Restricted Area";
            auth_basic_user_file /etc/nginx/htpasswd;
            alias /usr/share/nginx/html/admin.html;
            default_type text/html;
        }
    }

    # ------------------------------------------------------------------
    # Virtual Host 2: site-b.local (Second project)
    # ------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name site-b.local;
        charset utf-8;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        root /var/www/site-b;
        index index.html;

        # Custom 404 error page for site-b
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        # Serve static files, no SPA fallback, no admin access here
        location / {
            try_files $uri $uri/ =404;
        }
    }
}